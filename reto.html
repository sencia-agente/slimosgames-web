<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Te han retado en Slimos</title>
<meta name="description" content="¿Superas el reto de hoy? Slimos, gratis en App Store y Google Play.">
<meta property="og:title" content="Te han retado en Slimos"><meta property="og:description" content="¿Superas el reto de hoy? Gratis en App Store y Google Play">
<meta property="og:image" content="https://slimosgames.com/img/apple-touch-icon.png"><meta name="theme-color" content="#1B1F4C">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png"><link rel="icon" href="img/favicon.png">
<style>
@font-face{font-family:Fr;font-weight:700;src:url(Fredoka-700.ttf);font-display:swap}
@font-face{font-family:Fr;font-weight:600;src:url(Fredoka-600.ttf);font-display:swap}
@font-face{font-family:Nu;font-weight:600;src:url(Nunito-600.ttf);font-display:swap}
@font-face{font-family:Nu;font-weight:800;src:url(Nunito-800.ttf);font-display:swap}
/* same colours as the game (dark theme) */
:root{--bg:#1B1F4C;--panel:#262B63;--box:#1E2255;--ink:#EEF0FF;--muted:#9CA3D8;--btn:#E9E4FA;--btn-sh:#A99BE0;--btn-ink:#1E1A4D;--ye:#FFD95A;--gr:#6EE7A0;--pk:#FF8AD8;--cy:#5EC8FF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nu,system-ui,sans-serif}
/* the game's mural: slime outlines drawn on the wall, with the soft dark edges of the share picture */
body{min-height:100vh;overflow-x:hidden;position:relative;background:url(img/mural.webp) center top/1080px auto repeat-y,var(--bg)}
body:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 60% at 50% 38%,rgba(5,3,26,0) 45%,rgba(5,3,26,.5) 100%),linear-gradient(180deg,rgba(16,13,48,0) 60%,rgba(16,13,48,.9) 100%)}
.wrap{position:relative;max-width:440px;margin:0 auto;padding:max(26px,env(safe-area-inset-top)) 18px 40px;display:flex;flex-direction:column;align-items:center}
.logo{font-family:Fr;font-weight:700;font-size:58px;line-height:1;text-shadow:0 6px 22px rgba(5,3,26,.7)}
.gang{position:relative;width:300px;height:118px;margin-top:20px}
.gang img{position:absolute;filter:drop-shadow(0 8px 10px rgba(5,3,26,.45))}
.gang .a{left:0;bottom:0;width:58px;animation:bob 3s ease-in-out infinite}
.gang .b{left:66px;bottom:0;width:168px}
.gang .c{left:121px;bottom:47px;width:58px;animation:bob 3s ease-in-out .5s infinite}
.gang .d{left:242px;bottom:0;width:58px;animation:bob 3s ease-in-out 1s infinite}
.pill{margin-top:22px;display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-family:Fr;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 0 var(--btn-sh)}
.pill svg{width:17px;height:17px}
h1{margin:14px 0 0;font-family:Fr;font-size:36px;line-height:1.05;text-align:center;font-weight:700;text-shadow:0 4px 16px rgba(5,3,26,.6)}
h1 em{font-style:normal;color:var(--ye)}
.sub{margin:8px 0 0;color:var(--muted);font-weight:600;font-size:15.5px;text-align:center}
/* the versus card, built like the game's result panels */
.vs{position:relative;align-self:stretch;margin-top:22px;display:grid;grid-template-columns:1fr auto 1fr;background:var(--panel);border-radius:26px;padding:18px 12px;border:1.5px solid rgba(255,255,255,.08);box-shadow:0 18px 40px rgba(5,3,26,.45)}
.side{display:flex;flex-direction:column;align-items:center;gap:9px;padding:0 4px}
.who{display:flex;align-items:center;gap:7px;font-weight:800;font-size:12.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.who img{width:26px;height:26px}
.time{font-family:Fr;font-weight:700;font-size:44px;line-height:1;background:var(--box);border-radius:16px;padding:10px 0;width:100%;text-align:center}
.time.q{color:#B9A6FF;border:2.5px dashed rgba(185,166,255,.55);background:none;padding:7px 0;animation:pulse 1.6s ease-in-out infinite}
.drops{height:24px}
.sq{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:150px}
.sq i{width:14px;height:14px;border-radius:4.5px;display:block;box-shadow:inset 0 -2.5px 0 rgba(0,0,0,.2)}
.meta{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13.5px;color:var(--ink)}.meta svg{width:15px;height:15px}
.tbd{font-weight:600;font-size:13.5px;color:var(--muted);text-align:center;line-height:1.3}
.mid{display:flex;align-items:center;justify-content:center;position:relative;width:44px}
.mid:before{content:"";position:absolute;top:4px;bottom:4px;left:50%;border-left:2px dashed rgba(255,255,255,.1)}
.mid b{position:relative;width:42px;height:42px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;font-family:Fr;font-size:16px;box-shadow:0 3px 0 var(--btn-sh)}
.info{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:14px;color:var(--muted)}
.info span{display:inline-flex;align-items:center;gap:6px;background:rgba(38,43,99,.85);padding:7px 13px;border-radius:12px;border:1.5px solid rgba(255,255,255,.06)}
.info .cd{color:var(--ink)}.info svg{width:16px;height:16px;color:#FFA94D}
.badges{margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.badges a{display:block;transition:transform .15s}.badges a:active{transform:scale(.96)}
.badges img{height:50px;display:block}
.free{margin-top:10px;color:var(--muted);font-weight:600;font-size:14px}
.steps{margin-top:24px;align-self:stretch;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{background:rgba(38,43,99,.9);border:1.5px solid rgba(255,255,255,.06);border-radius:18px;padding:12px 6px;text-align:center;font-weight:800;font-size:13px;color:var(--ink);line-height:1.25}
.step img{display:block;width:34px;height:34px;margin:0 auto 7px}
footer{margin-top:28px;color:var(--muted);font-size:13px;font-weight:600}footer a{color:var(--muted)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
</style></head>
<body>
<div class="wrap">
 <div class="logo">Slimos</div>
 <div class="gang" aria-hidden="true"><img class="a" src="img/reto/s5.webp" alt=""><img class="b" src="img/reto/l3.webp" alt=""><img class="c" src="img/reto/s4.webp" alt=""><img class="d" src="img/reto/s9.webp" alt=""></div>
 <div class="pill"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.457 3L21 3.003l.002 3.523-5.467 5.466 2.828 2.829 1.415-1.414 1.414 1.414-2.474 2.475 2.828 2.829-1.414 1.414-2.829-2.829-2.475 2.475-1.414-1.414 1.414-1.415-2.829-2.828-2.828 2.828 1.415 1.415-1.414 1.414-2.475-2.475-2.829 2.829-1.414-1.414 2.829-2.83-2.475-2.474 1.414-1.414 1.414 1.413 2.827-2.828-5.46-5.46L3 3l3.546.003 5.453 5.454L17.457 3zm-7.58 10.406L7.05 16.234l.708.707 2.827-2.828-.707-.707zm9.124-8.405h-.717l-4.87 4.869.706.707 4.881-4.879V5zM5 5v.716l.706.707.708-.709L5.705 5H5z"/></svg><span id="tPill">Te han retado</span></div>
 <h1 id="tH1">¿Le ganas a <em>tu amigo</em>?</h1>
 <p class="sub" id="tSub">El mismo puzle para todo el mundo, hoy.</p>

 <div class="vs">
  <div class="side">
   <div class="who"><img src="img/reto/s7.webp" alt=""><span id="tFriend">Tu amigo</span></div>
   <div class="time" id="time">0:47</div>
   <img class="drops" src="img/reto/drops.webp" alt="">
   <div class="sq" id="sq"></div>
   <div class="meta" id="streak"></div>
  </div>
  <div class="mid"><b>VS</b></div>
  <div class="side">
   <div class="who"><img src="img/reto/sB.webp" alt=""><span id="tYou">Tú</span></div>
   <div class="time q">¿?</div>
   <div class="tbd" id="tTbd">Descárgalo y supera su tiempo</div>
  </div>
 </div>

 <div class="info"><span id="day">Reto #20</span><span class="cd"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.618 5.968l1.453-1.453 1.414 1.414-1.453 1.453a9 9 0 1 1-1.414-1.414zM12 20a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM11 8h2v6h-2V8zM8 1h8v2H8V1z"/></svg><b id="cd">--:--:--</b></span></div>

 <div class="badges">
  <a id="as" href="https://apps.apple.com/es/app/slimos-logic-puzzle/id6829811642"><img id="asI" src="img/as_es.svg" alt="App Store"></a>
  <a id="gp" href="https://play.google.com/store/apps/details?id=com.slimosgames.slimos"><img id="gpI" src="img/gp_es.svg" alt="Google Play"></a>
 </div>
 <div class="free" id="tFree">Gratis · Sin registro</div>

 <div class="steps">
  <div class="step"><img src="img/reto/s5.webp" alt=""><span id="s1">Descarga Slimos</span></div>
  <div class="step"><img src="img/reto/s4.webp" alt=""><span id="s2">Toca «Reto diario»</span></div>
  <div class="step"><img src="img/reto/s9.webp" alt=""><span id="s3">Bate su tiempo</span></div>
 </div>
 <footer>© 2026 Slimos Games · <a href="./">slimosgames.com</a></footer>
</div>
<script>
(function(){
 // link from the game: reto.html?d=20&t=47&s=7&q=ggyggyg&l=es  (d = challenge number, t = seconds, s = streak, q = g/y per slime)
 var P=new URLSearchParams(location.search),lang=(P.get("l")||navigator.language||"es").slice(0,2)==="es"?"es":"en";
 var d=+P.get("d")||0,t=+P.get("t"),s=+P.get("s")||0,q=(P.get("q")||"").replace(/[^gy]/g,"").slice(0,24);
 var T={es:{pill:"Te han retado",h1:"¿Le ganas a <em>tu amigo</em>?",sub:"El mismo puzle para todo el mundo, hoy.",friend:"Tu amigo",you:"Tú",tbd:"Descárgalo y supera su tiempo",day:"Reto #",ends:"Acaba en ",free:"Gratis · Sin registro",s1:"Descarga Slimos",s2:"Toca «Reto diario»",s3:"Bate su tiempo",days:"días seguidos"},
        en:{pill:"You've been challenged",h1:"Can you beat <em>your friend</em>?",sub:"Same puzzle for everyone, today.",friend:"Your friend",you:"You",tbd:"Get it and beat their time",day:"Challenge #",ends:"Ends in ",free:"Free · No sign-up",s1:"Get Slimos",s2:"Tap “Daily challenge”",s3:"Beat their time",days:"day streak"}}[lang];
 var $=function(i){return document.getElementById(i)};
 document.documentElement.lang=lang;
 $("tPill").textContent=T.pill;$("tH1").innerHTML=T.h1;$("tSub").textContent=T.sub;$("tFriend").textContent=T.friend;$("tYou").textContent=T.you;$("tTbd").textContent=T.tbd;$("tFree").textContent=T.free;$("s1").textContent=T.s1;$("s2").textContent=T.s2;$("s3").textContent=T.s3;
 if(lang==="en"){$("as").href="https://apps.apple.com/app/slimos-logic-puzzle/id6829811642";$("asI").src="img/as_en.svg";$("gpI").src="img/gp_en.svg"}
 // today's number when the link has none
 if(!d){var e=new Date(2026,10,1),n=new Date();d=Math.max(1,Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-e)/864e5)+1)}
 $("day").textContent=T.day+d;
 $("time").textContent=t>0?Math.floor(t/60)+":"+String(t%60).padStart(2,"0"):"✓";
 var C={g:"#6EE7A0",y:"#FFD95A"};$("sq").innerHTML=q.split("").map(function(c){return'<i style="background:'+C[c]+'"></i>'}).join("");
 if(s>1)$("streak").innerHTML='<svg viewBox="0 0 24 24" fill="#FF9A3C"><path d="M12 23a7.5 7.5 0 0 1-5.138-12.963C8.204 8.774 11.5 6.5 11 1.5c6 4 9 8 3 14 1 0 2.5 0 5-2.47.27.773.5 1.604.5 2.47A7.5 7.5 0 0 1 12 23z"/></svg>'+s+" "+T.days;
 // countdown to midnight: the challenge changes every day
 function tick(){var n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),x=Math.max(0,Math.floor((m-n)/1e3));
  $("cd").textContent=T.ends+String(Math.floor(x/3600)).padStart(2,"0")+":"+String(Math.floor(x%3600/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
 tick();setInterval(tick,1000);
})();
</script>
</body></html>
